services:
  control-plane:
    environment:
      AO_CLOUD_SANDBOX_PROVIDERS: docker,coder
      AO_CLOUD_WORKER_BINARY_PATH: /ao-worker
      AO_CLOUD_WORKER_HELPER_BINARY_PATH: /ao
      AO_CLOUD_CODER_URL: "${AO_CLOUD_CODER_URL}"
      AO_CLOUD_CODER_TOKEN: "${AO_CLOUD_CODER_TOKEN}"
      AO_CLOUD_CODER_OWNER: "${AO_CLOUD_CODER_OWNER}"
      AO_CLOUD_CODER_TEMPLATE_ID: "${AO_CLOUD_CODER_TEMPLATE_ID}"
      AO_CLOUD_CODER_AGENT_NAME: "${AO_CLOUD_CODER_AGENT_NAME}"
      AO_CLOUD_CODER_DURABLE_ROOT: "${AO_CLOUD_CODER_DURABLE_ROOT}"
      AO_CLOUD_CODER_PARAMETERS_JSON: "{}"
