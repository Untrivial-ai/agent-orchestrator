name: Remind weekly changelog reviewers

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: weekly-changelog-reminders
  cancel-in-progress: false

jobs:
  remind:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Remind reviewers after each six-hour interval
        shell: bash
        run: |
          marker='<!-- weekly-changelog-reminder -->'
          now="$(date -u +%s)"

          while IFS= read -r pull_request; do
            [ -n "$pull_request" ] || continue

            number="$(jq -r '.number' <<<"$pull_request")"
            created_at="$(jq -r '.createdAt' <<<"$pull_request")"
            url="$(jq -r '.url' <<<"$pull_request")"
            last_reminder="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .created_at" | sort | tail -n 1)"
            baseline="${last_reminder:-$created_at}"
            baseline_epoch="$(date -u -d "$baseline" +%s)"

            if (( now - baseline_epoch < 21600 )); then
              continue
            fi

            gh pr comment "$number" --body "$marker
          @somewherelostt @illegalcall @AgentWrapper — this weekly changelog draft is still open after another six hours: $url

          Please complete the editorial review, add the required high-quality image or video, verify the preview and checks, and merge it when ready."
          done < <(
            gh pr list \
              --state open \
              --limit 100 \
              --json number,headRefName,createdAt,url \
              --jq '.[] | select(.headRefName | startswith("changelog/")) | @json'
          )
