name: PR Review Leaderboard

on:
  # pull_request_target lets the workflow comment on PRs from forks. This job
  # deliberately does not check out or execute code from the pull request.
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  leaderboard:
    name: Post trailing 7-day review stats
    runs-on: ubuntu-latest
    steps:
      - name: Comment review leaderboard
        # v3.2.3, pinned to an immutable commit for supply-chain safety.
        uses: flowwer-dev/pull-request-stats@6236a6616b9c683d6aff201a289e96b731b9cdd7
        with:
          githubToken: ${{ github.token }}
          period: 7
          stats: totalComments,totalReviews
          sortBy: totalComments
          publishAs: COMMENT
          exclude: '/\[bot\]$/i'
          disableLinks: true
