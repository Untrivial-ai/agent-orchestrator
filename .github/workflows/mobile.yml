name: Mobile

# Typechecks the Expo mobile app. Without this, changes under packages/mobile
# (e.g. the push-notification client) shipped with no CI coverage — the existing
# frontend/go workflows don't touch this package.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile.yml"
      # Bundled into the app: lib/chat/ansi.ts imports packages/shared/chat/ansi.ts.
      - "packages/shared/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mobile/package-lock.json

      # .npmrc pins legacy-peer-deps for this package; npm ci honors it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Typecheck and unit tests never run Metro, so a change that only breaks the
      # bundle (a computed import(), a missing asset) merges green (#6326). This is
      # the export `eas update` runs, without the source and asset maps. No secrets.
      - name: Bundle (iOS + Android)
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"
