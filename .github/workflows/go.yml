name: Go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "pricing/**"
      - "frontend/src/api/schema.ts"
      - "package.json"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can't drift from the module
          # (it previously pinned 1.22 while go.mod declared 1.25).
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The SQLite migration package already runs close to Go's default
        # 10-minute per-package limit under the race detector. Keep deadlock
        # protection while leaving enough headroom for migration coverage.
        run: go test -race -timeout=15m ./...

  # The suite above only ever runs on Linux, so the packages whose behaviour is
  # genuinely platform-specific have never been exercised on Windows: worktree
  # teardown renames and unlinks directories, and Windows is the platform where
  # an open handle makes both fail. Scoped to those packages rather than the
  # whole suite to keep the matrix cheap.
  windows-workspace:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      # Scoped to teardown and kill by name rather than running these packages
      # whole: running them on Windows for the first time surfaced ten
      # pre-existing failures (agent switching, handoff artifacts, spawn PATH
      # and branch namespacing) that have nothing to do with worktree teardown.
      # Widening this is worth doing, but as its own change with its own fixes.
      - name: Test SQLite filesystem path identity
        run: go test -race -run 'Test(OpenPreservesDataDirectoryCharacters|FragmentPathsKeepDatabasesIsolated|OpenRefusesToHideLegacyDatabase|OpenPrefersExistingIntendedDatabase|DatabaseURIPreservesWindowsPaths)$' ./internal/storage/sqlite

      - name: Test workspace teardown and session kill
        run: go test -race -v -run 'Destroy|Discard|Sweep|Kill' ./internal/adapters/workspace/... ./internal/session_manager/

      - name: Test Windows Chat environment precedence
        run: go test -race ./internal/adapters/chatdriver/processenv/ ./internal/agentlaunch/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: golangci-lint
        # v8 of the action drives golangci-lint v2 (the schema this config uses);
        # the v6 action speaks v1 CLI flags and errors against a v2 binary.
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned for reproducibility: bump intentionally rather than letting an
          # upstream release change CI. Must be built with Go >= the module's
          # (go.mod is 1.25); v2.12.2 is built with go1.25 — older v2 tags
          # (e.g. v2.1.x) are built with go1.24 and refuse to analyze 1.25 code.
          version: v2.12.2
          working-directory: backend
          # Blocking on the full ruleset: the tree is clean at zero findings, so
          # any new issue fails CI rather than being grandfathered.

  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API spec and TS types
        run: npm run api

      # openapi.yaml drift is already caught by TestBuild_MatchesEmbedded in
      # the build-test job (go test -race ./...). Only schema.ts needs checking here.
      - name: Check for schema.ts drift
        run: git diff --exit-code -- frontend/src/api/schema.ts
