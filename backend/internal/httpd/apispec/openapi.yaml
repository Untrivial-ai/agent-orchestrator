      properties:
        asWorkspace:
          type: boolean
        clonePreparationId:
          type: string
        config:
          $ref: '#/components/schemas/ProjectConfig'
        name:
          type:
          - "null"
          - string
        path:
          type: string
        projectId:
          type:
          - "null"
          - string
      required:
      - path
      type: object
    AgentAuthPlan:
      properties:
        action:
          type: string
        agentId:
          type: string
        available:
          type: boolean
        displayCommand:
          type: string
        documentationUrl:
          type: string
        guidance:
          type: string
        launchMode:
          enum:
          - terminal
          - documentation
          type: string
        reason:
          type: string
      required:
      - agentId
      - action
      - launchMode
      - available
      - documentationUrl
      type: object
    AgentAuthenticationObservation:
      properties:
        attemptedAt:
          format: date-time
          type:
          - "null"
          - string
        checkedAt:
          format: date-time
          type:
          - "null"
          - string
        freshness:
          enum:
          - fresh
          - stale
          - checking
          type: string
        reason:
          type: string
        reasonCode:
          type: string
        state:
          enum:
          - authorized
          - unauthorized
          - unknown
          - not_applicable
          type: string
      required:
      - state
      - freshness
      - checkedAt
      - attemptedAt
      - reasonCode
      - reason
      type: object
