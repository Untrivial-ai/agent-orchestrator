      properties:
        authStatus:
          description: Advisory local auth probe result. authorized means a recent
            local probe passed; spawn remains the authoritative validation point.
          enum:
          - authorized
          - unauthorized
          - unknown
          type: string
        id:
          type: string
        label:
          type: string
        lastUsedAt:
          description: Creation time of the newest retained session currently attributed
            to this agent.
          format: date-time
          type:
          - "null"
          - string
        usageCount:
          description: Number of retained sessions currently attributed to this agent.
          type: integer
      required:
      - id
      - label
      type: object
