version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/storage/sqlite/migrations"
    queries: "internal/storage/sqlite/queries"
    gen:
      go:
        package: "gen"
        out: "internal/storage/sqlite/gen"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: false
        emit_empty_slices: true
        initialisms:
          - id
          - url
          - pr
          - ci
        overrides:
          - column: "change_log.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "change_log.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
              pointer: true
          - column: "change_log.event_type"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/cdc"
              type: "EventType"
          - column: "pr.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "pr.pr_state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "PRState"
          - column: "pr.review_decision"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewDecision"
          - column: "pr.ci_state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "CIState"
          - column: "pr.mergeability"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "Mergeability"
          - column: "pr_checks.status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "PRCheckStatus"
          - column: "pr_comment.resolved"
            go_type: "bool"
          - column: "notifications.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "notifications.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "notifications.type"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "NotificationType"
          - column: "notifications.status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "NotificationStatus"
          - column: "projects.id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "workspace_repos.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "session_worktrees.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "session_cleanup_facts.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "sessions.id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "sessions.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "sessions.issue_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "IssueID"
          - column: "sessions.kind"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionKind"
          - column: "sessions.harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHarness"
          - column: "sessions.reviewer_harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewerHarness"
          - column: "sessions.auto_review_enabled"
            go_type: "bool"
          - column: "sessions.activity_state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ActivityState"
          - column: "usage_bindings.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "usage_bindings.harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHarness"
          - column: "usage_bindings.state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "UsageBindingState"
          - column: "usage_sources.kind"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "UsageSourceKind"
          - column: "usage_sources.state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "UsageSourceState"
          - column: "agent_native_sessions.id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentNativeSessionID"
          - column: "agent_native_sessions.ao_session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "agent_native_sessions.harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHarness"
          - column: "agent_native_sessions.last_generation_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentGenerationID"
          - column: "agent_switches.id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentSwitchID"
          - column: "agent_switches.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "agent_switches.request_fingerprint"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentSwitchRequestFingerprint"
          - column: "agent_switches.from_harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHarness"
          - column: "agent_switches.target_harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHarness"
          - column: "agent_switches.target_native_session_ref"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentNativeSessionID"
              pointer: true
          - column: "agent_switches.target_start_mode"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentSwitchTargetStartMode"
          - column: "agent_switches.state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentSwitchState"
          - column: "agent_switches.agent_handoff_status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentHandoffStatus"
          - column: "agent_switches.source_transcript_status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentSwitchSourceTranscriptStatus"
          - column: "agent_switches.semantic_handoff_included"
            go_type: "bool"
          - column: "agent_switches.source_generation_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentGenerationID"
          - column: "agent_switches.target_generation_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "AgentGenerationID"
          - column: "review.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "review.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "review.harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewerHarness"
          - column: "review_run.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "review_run.harness"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewerHarness"
          - column: "review_run.status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewRunStatus"
          - column: "review_run.verdict"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewVerdict"
          - column: "review_run.trigger_source"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ReviewTriggerSource"
          - column: "app_settings.default_session_mode"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionMode"
          - column: "sessions.session_mode"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionMode"
          - column: "session_interface_transitions.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "session_interface_transitions.source_mode"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionMode"
          - column: "session_interface_transitions.target_mode"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionMode"
          - column: "session_interface_transitions.policy"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionInterfaceTransitionPolicy"
          - column: "session_interface_transitions.phase"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionInterfaceTransitionPhase"
          - column: "conversations.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
          - column: "conversations.scope"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ConversationScope"
          # Nullable: a project-scoped conversation has no single owning session.
          - column: "conversations.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
              pointer: true
          - column: "conversations.current_session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
              pointer: true
          - column: "conversation_turns.handled_by_session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          - column: "conversation_turns.state"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "TurnState"
          - column: "conversation_messages.role"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "MessageRole"
          - column: "conversation_messages.origin"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "MessageOrigin"
          - column: "conversation_activities.kind"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ActivityKind"
          - column: "conversation_activities.status"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ActivityStatus"
          - column: "conversation_provider_events.session_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "SessionID"
          # Nullable: a shell terminal opened with no project context has no
          # project row to point at (it starts in the daemon's data dir).
          - column: "shell_terminals.project_id"
            go_type:
              import: "github.com/aoagents/agent-orchestrator/backend/internal/domain"
              type: "ProjectID"
              pointer: true
